name: Validate Magento Breeze Docker build

on:
  workflow_dispatch:
  push:
    branches: [diseno-lavanda]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/validate-breeze.yml

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Magento and Breeze without deploying
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: campo-lavanda-magento:breeze-test
          cache-from: type=gha
          cache-to: type=gha,mode=min
